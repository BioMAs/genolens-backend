version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-genolens}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genolens"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - default

  # Redis for Celery task queue
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - default

  # FastAPI Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-genolens}
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-genolens-data}
      - ENVIRONMENT=production
      - LOCAL_STORAGE_PATH=/app/data
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-4-E4B-it}
      - 'CORS_ORIGINS=["https://app.genolens.com", "https://admin.genolens.com", "https://preprod.genolens.com", "https://api-v2.genolens.com", "http://localhost:3000"]'
      - GENOLENS_LICENSE_KEY=${GENOLENS_LICENSE_KEY}
      - LICENSE_SECRET_KEY=${LICENSE_SECRET_KEY}
      - LICENSE_PRODUCT=${LICENSE_PRODUCT:-genolens}
      # Email (Resend via SMTP)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_TLS=${SMTP_TLS:-false}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-GenoLens}
      - SALES_EMAIL=${SALES_EMAIL:-contact@scilicium.com}
      # Drug Discovery (service genolens-dd). La clé vient du .env de l'hôte, jamais de
      # l'image : un .env embarqué au build est celui du checkout, donc sans secret, et
      # l'API répondait « non configuré » en production alors que l'hôte avait la clé.
      # Les valeurs par défaut sont OBLIGATOIRES ici : sans elles, une variable absente du
      # .env deviendrait une chaîne vide qui écraserait le défaut du code.
      - DD_BASE_URL=${DD_BASE_URL:-https://dd.genolens.com}
      - DD_API_KEY=${DD_API_KEY}
      - DD_TIMEOUT_SECONDS=${DD_TIMEOUT_SECONDS:-30}

    volumes:
      - genolens_storage:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    restart: always
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      # Router Definition
      - "traefik.http.routers.genolens-api.rule=Host(`api-v2.genolens.com`)"
      - "traefik.http.routers.genolens-api.entrypoints=websecure"
      - "traefik.http.routers.genolens-api.tls.certresolver=letsencrypt"
      # Service Definition
      - "traefik.http.services.genolens-api.loadbalancer.server.port=8000"

  # Celery Worker for background tasks
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-genolens}
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-genolens-data}
      - ENVIRONMENT=production
      - LOCAL_STORAGE_PATH=/app/data
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-4-E4B-it}
      - GENOLENS_LICENSE_KEY=${GENOLENS_LICENSE_KEY}
      - LICENSE_SECRET_KEY=${LICENSE_SECRET_KEY}
      - LICENSE_PRODUCT=${LICENSE_PRODUCT:-genolens}
      # Email (Resend via SMTP)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_TLS=${SMTP_TLS:-false}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-GenoLens}
      - SALES_EMAIL=${SALES_EMAIL:-contact@scilicium.com}
    volumes:
      - genolens_storage:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --loglevel=info -Q celery,default,data_processing
    restart: always
    networks:
      - default

  # R worker — DEG pipeline (DESeq2/edgeR/limma) + annoDB functional enrichment
  r-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: r-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-genolens}
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - SUPABASE_STORAGE_BUCKET=${SUPABASE_STORAGE_BUCKET:-genolens-data}
      - ENVIRONMENT=production
      - LOCAL_STORAGE_PATH=/app/data
      - R_SCRIPTS_PATH=/app/r_scripts
      - ANNO_DB_PATH=/app/anno_db
      - ANNO_DB_STORAGE=${ANNO_DB_STORAGE:-/app/anno_db}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-google/gemma-4-E4B-it}
      - GENOLENS_LICENSE_KEY=${GENOLENS_LICENSE_KEY}
      - LICENSE_SECRET_KEY=${LICENSE_SECRET_KEY}
      - LICENSE_PRODUCT=${LICENSE_PRODUCT:-genolens}
    volumes:
      - genolens_storage:/app/data
      - ${ANNO_DB_HOST_PATH:-./anno_db}:/app/anno_db:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --loglevel=info -Q r_analysis --concurrency=1
    restart: always
    networks:
      - default

volumes:
  postgres_data:
  genolens_storage:

networks:
  web:
    external: true