name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          APP_NAME=GenoLens CI
          APP_VERSION=1.0.0
          ENVIRONMENT=test
          DEBUG=false
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/genolens_test
          DB_ECHO=false
          DB_POOL_SIZE=5
          DB_MAX_OVERFLOW=10
          REDIS_URL=redis://redis:6379/0
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_KEY=placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY=placeholder_service_role_key
          SUPABASE_JWT_SECRET=placeholder_jwt_secret_for_ci_testing_only_32chars
          SUPABASE_STORAGE_BUCKET=genolens-test
          CORS_ORIGINS=["http://localhost:3000"]
          MAX_UPLOAD_SIZE=524288000
          ALLOWED_FILE_EXTENSIONS=[".csv",".tsv",".xlsx",".txt"]
          PARQUET_COMPRESSION=snappy
          CHUNK_SIZE=10000
          APP_URL=http://localhost:3000
          SMTP_HOST=
          SMTP_PORT=587
          SMTP_USER=
          SMTP_PASSWORD=
          SMTP_TLS=false
          SMTP_STARTTLS=true
          EMAIL_FROM_ADDRESS=ci@genolens.io
          EMAIL_FROM_NAME=GenoLens CI
          STRIPE_SECRET_KEY=
          STRIPE_PUBLISHABLE_KEY=
          STRIPE_WEBHOOK_SECRET=
          STRIPE_PRICE_PREMIUM_MONTHLY=
          STRIPE_PRICE_ADVANCED_MONTHLY=
          LOCAL_STORAGE_PATH=/tmp/genolens_test
          LLM_BASE_URL=http://localhost:11434/v1
          LLM_API_KEY=ci-not-needed
          LLM_MODEL=google/gemma-4-E4B-it
          EOF

      - name: Build and start services (postgres, redis, api only)
        run: |
          docker compose up -d --build postgres redis api
        env:
          DOCKER_BUILDKIT: 1

      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API health check..."
          for i in $(seq 1 30); do
            if docker compose exec -T api curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            echo "  attempt $i/30..."
            sleep 5
          done

      - name: Run database migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Run tests
        run: |
          docker compose exec -T api pip install -q -r requirements-dev.txt
          docker compose exec -T api pytest --tb=short -q

      - name: Show logs on failure
        if: failure()
        run: docker compose logs api

  deploy:
    name: Deploy to production
    needs: test
    # Auto-deploy only on a push to main (not on PRs / develop). Also runnable manually.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: 37.187.254.33
      DEPLOY_USER: tdarde
      DEPLOY_PATH: /opt/genolens/backend
      COMPOSE_FILE: docker-compose.prod.yml
      HEALTH_URL: https://api-v2.genolens.com/health

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Sync backend source to server
        # The prod server is NOT a git checkout; the Dockerfile builds via `COPY . .`,
        # so we push the source tree and rebuild (mirrors the manual deploy.py flow).
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.pytest_cache' \
            --exclude='.venv' \
            --exclude='venv' \
            --exclude='.env' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Sync alembic migrations exactly (remove stale files)
        # alembic/versions must match the repo exactly: stale migration files left
        # on the server create extra alembic heads and break `alembic upgrade head`.
        # --delete is safe here because the dir only ever contains migration files.
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            ./alembic/versions/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/alembic/versions/"

      - name: Build, migrate, restart
        # Build first, run migrations, then restart services with the new image.
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -e; cd $DEPLOY_PATH && \
             docker compose -f $COMPOSE_FILE build api worker r-worker && \
             docker compose -f $COMPOSE_FILE run --rm api alembic upgrade head && \
             docker compose -f $COMPOSE_FILE up -d --no-deps api worker r-worker && \
             docker compose -f $COMPOSE_FILE ps"

      - name: Health check
        # Retry: the freshly restarted container needs a few seconds to accept traffic.
        run: |
          for i in $(seq 1 20); do
            if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null 2>&1; then
              echo "healthy after $i attempt(s)"
              curl --silent "$HEALTH_URL"; echo
              exit 0
            fi
            echo "attempt $i/20: not ready yet, waiting 5s..."
            sleep 5
          done
          echo "Health check failed after 20 attempts" >&2
          exit 1
