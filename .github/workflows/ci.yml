name: Backend CI

on:
  push:
    branches: [main, develop, prepro]
  pull_request:
    branches: [main, develop, prepro]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          APP_NAME=GenoLens CI
          APP_VERSION=1.0.0
          ENVIRONMENT=test
          DEBUG=false
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/genolens_test
          DB_ECHO=false
          DB_POOL_SIZE=5
          DB_MAX_OVERFLOW=10
          REDIS_URL=redis://redis:6379/0
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_KEY=placeholder_anon_key
          SUPABASE_SERVICE_ROLE_KEY=placeholder_service_role_key
          SUPABASE_JWT_SECRET=placeholder_jwt_secret_for_ci_testing_only_32chars
          SUPABASE_STORAGE_BUCKET=genolens-test
          CORS_ORIGINS=["http://localhost:3000"]
          MAX_UPLOAD_SIZE=524288000
          ALLOWED_FILE_EXTENSIONS=[".csv",".tsv",".xlsx",".txt"]
          PARQUET_COMPRESSION=snappy
          CHUNK_SIZE=10000
          APP_URL=http://localhost:3000
          SMTP_HOST=
          SMTP_PORT=587
          SMTP_USER=
          SMTP_PASSWORD=
          SMTP_TLS=false
          SMTP_STARTTLS=true
          EMAIL_FROM_ADDRESS=ci@genolens.io
          EMAIL_FROM_NAME=GenoLens CI
          STRIPE_SECRET_KEY=
          STRIPE_PUBLISHABLE_KEY=
          STRIPE_WEBHOOK_SECRET=
          STRIPE_PRICE_PREMIUM_MONTHLY=
          STRIPE_PRICE_ADVANCED_MONTHLY=
          LOCAL_STORAGE_PATH=/tmp/genolens_test
          OLLAMA_BASE_URL=http://localhost:11434
          EOF

      - name: Build and start services (postgres, redis, api only)
        # NOTE: prometheus and grafana are NOT started in CI — they are
        # observability tools only and are not required for running tests.
        run: |
          docker compose up -d --build postgres redis api
        env:
          DOCKER_BUILDKIT: 1

      - name: Wait for API to be healthy
        run: |
          echo "Waiting for API health check..."
          for i in $(seq 1 30); do
            if docker compose exec -T api curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is healthy"
              break
            fi
            echo "  attempt $i/30..."
            sleep 5
          done

      - name: Run database migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Run tests
        run: docker compose exec -T api pytest --tb=short -q

      - name: Show logs on failure
        if: failure()
        run: docker compose logs api
